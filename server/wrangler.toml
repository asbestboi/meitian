name = "meitian"
main = "src/index.ts"
# the separate Měitiān Cloudflare account (never the Gonovu one)
account_id = "a24553bac956ebe2fcfd66885bf83196"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "meitian"
database_id = "956b2759-fab4-4f20-ada6-7bb763331107"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "MATCHMAKER", class_name = "Matchmaker" },
  { name = "ROOMS", class_name = "Room" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "Room"]

[triggers]
crons = ["0 0 * * MON"]
